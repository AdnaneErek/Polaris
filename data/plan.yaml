        owner: "Data Governance Lead"
        start: "2026-01-15"
        end: "2026-04-30"
        effort_fte_months: 4.5
        deliverables:
          - id: D_DQ1_RULES_1
            name: "Critical data elements and thresholds"
            due: "2026-03-15"
            owner: "Data Governance Lead"
            definition_of_done: ["Top 30 elements approved", "Thresholds signed off"]
            operational_kpis: ["KPI_STP"]
          - id: D_DQ1_RULES_2
            name: "Data ownership and escalation RACI"
            due: "2026-04-30"
            owner: "Data Lead"
            definition_of_done: ["Ownership matrix complete", "Escalation path tested"]
            operational_kpis: ["KPI_STP", "KPI_INC"]
        control_impacts: ["Improves data control accountability"]
        depends_on_workstreams: []
      - id: WS_DQ1_LINEAGE
