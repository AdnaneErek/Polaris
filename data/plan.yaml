meta:
  org: "BankXCIB - TBS - CMS (synthetic PoC)"
  perimeter:
    business_line: "Transaction Banking Services"
    domain: "Cash Management Services"
    scope: "IT & Operations"
  horizon:
    start: "2026-01-01"
    end: "2028-12-31"
    cadence: "monthly"              # reporting cadence
  version: "0.2"
  authors: ["Adnane (PoC)"]
  last_updated: "2026-01-15"
  assumptions:
    - "All data is synthetic; structure mirrors enterprise reality."
    - "No autonomous execution; human-in-the-loop required for changes."
  governance:
    decision_rights:
      propose: ["AI-Agent", "PMO"]
      approve: ["Transformation Lead", "IT Ops Head", "Risk/Compliance"]
      execute: ["Delivery Teams"]
    auditability:
      log_all_recommendations: true
      store_inputs_hashes: true
      rationale_required: true
    guardrails:
      - "No recommendation can violate regulatory constraints."
      - "No recommendation can reduce control coverage below threshold."
      - "High-impact actions require dual approval."

# ---------------------------------------------------------------------
# KPI CATALOG (with definitions + formulas + data sources)
# ---------------------------------------------------------------------
kpis:
  - id: KPI_STP
    name: "Straight-Through Processing rate"
    short_name: "STP_rate"
    unit: "%"
    frequency: "monthly"
    baseline:
      value: 82.0
      date: "2025-12-31"
    target:
      value: 95.0
      deadline: "2028-12-31"
      direction: "up"
    definition:
      description: "Share of eligible transactions processed end-to-end without manual intervention."
      formula: "100 * (count_auto_processed / count_eligible)"
      exclusions:
        - "Non-eligible flows (manual-only products)"
        - "Transactions flagged for compliance review"
    data_lineage:
      sources:
        - system: "Payments Engine"
          table_or_stream: "tx_events"
        - system: "Ops Tool"
          table_or_stream: "manual_interventions"
      quality_rules:
        - rule: "Eligible count must be >= auto processed"
          severity: "high"
        - rule: "Missing intervention flag < 0.5%"
          severity: "medium"
    owner:
      business: "Ops"
      data: "Data Office"
    risk_classification: "medium"

  - id: KPI_E2E
    name: "End-to-End Processing Time (priority flows)"
    short_name: "processing_time"
    unit: "hours"
    frequency: "monthly"
    baseline:
      value: 2.6
      date: "2025-12-31"
    target:
      value: 1.5
      deadline: "2028-12-31"
      direction: "down"
    definition:
      description: "Median time from initiation to posting for priority flows."
      formula: "median(posting_ts - initiation_ts) in hours"
      scope: "priority flows"
    data_lineage:
      sources:
        - system: "Front Office"
          table_or_stream: "initiation_events"
        - system: "Core Banking"
          table_or_stream: "posting_events"
      quality_rules:
        - rule: "Timestamps must be consistent (posting >= initiation)"
          severity: "high"
    owner:
      business: "Ops"
      data: "IOS Data"
    risk_classification: "low"

  - id: KPI_INC
    name: "Production Incidents impacting CMS services"
    short_name: "incident_count"
    unit: "count"
    frequency: "monthly"
    baseline:
      value: 35.0
      date: "2025-12-31"
    target:
      value: 20.0
      deadline: "2028-12-31"
      direction: "down"
    definition:
      description: "Count of Sev1–Sev3 incidents impacting CMS processes."
      formula: "count(incidents where severity in {1,2,3} and impact=CMS)"
    data_lineage:
      sources:
        - system: "ServiceNow"
          table_or_stream: "incidents"
      quality_rules:
        - rule: "Severity must be present"
          severity: "high"
    owner:
      business: "IT Ops"
      data: "ITSM"
    risk_classification: "high"

# ---------------------------------------------------------------------
# STRATEGIC OBJECTIVES (with weights, OKRs, and constraints)
# ---------------------------------------------------------------------
objectives:
  - id: OBJ_1
    name: "Increase automation and straight-through processing"
    description: "Improve STP to reduce manual workload, errors, and cost."
    weight: 0.40
    okrs:
      - id: OKR_1_1
        kpi_id: KPI_STP
        baseline: 82.0
        target: 95.0
        deadline: "2028-12-31"
        direction: "up"
        trajectory:
          type: "linear"            # linear, piecewise, s-curve
          checkpoints:
            - date: "2026-01-01"
              expected: 82.0
            - date: "2026-12-31"
              expected: 86.0
            - date: "2027-12-31"
              expected: 91.0
            - date: "2028-12-31"
              expected: 95.0
    constraints:
      - type: "compliance"
        description: "Automation must not bypass compliance checks or AML triggers."
      - type: "control_coverage"
        description: "Control coverage must remain >= 95% for automated flows."

  - id: OBJ_2
    name: "Reduce processing time and improve client experience"
    description: "Reduce cycle time of priority flows by process redesign and digitalization."
    weight: 0.35
    okrs:
      - id: OKR_2_1
        kpi_id: KPI_E2E
        baseline: 2.6
        target: 1.5
        deadline: "2028-12-31"
        direction: "down"
        trajectory:
          type: "piecewise"
          checkpoints:
            - date: "2026-01-01"
              expected: 2.6
            - date: "2026-12-31"
              expected: 2.3
            - date: "2027-12-31"
              expected: 1.9
            - date: "2028-12-31"
              expected: 1.5
    constraints:
      - type: "availability"
        description: "No material degradation of system availability (SLA maintained)."

  - id: OBJ_3
    name: "Strengthen operational resilience and risk control"
    description: "Reduce production incidents and improve observability and recovery."
    weight: 0.25
    okrs:
      - id: OKR_3_1
        kpi_id: KPI_INC
        baseline: 35.0
        target: 20.0
        deadline: "2028-12-31"
        direction: "down"
        trajectory:
          type: "linear"
          checkpoints:
            - date: "2026-01-01"
              expected: 35.0
            - date: "2026-12-31"
              expected: 30.0
            - date: "2027-12-31"
              expected: 24.0
            - date: "2028-12-31"
              expected: 20.0
    constraints:
      - type: "regulatory"
        description: "Must satisfy audit requirements and evidence retention."

# ---------------------------------------------------------------------
# CAPABILITY MAP (transformation domains)
# ---------------------------------------------------------------------
capabilities:
  - id: CAP_PROC
    name: "Process Excellence"
    description: "Process mining, redesign, lean controls"
  - id: CAP_DATA
    name: "Data & AI Enablement"
    description: "Data quality, lineage, AI integration, model governance"
  - id: CAP_TECH
    name: "IT Modernization"
    description: "Architecture, observability, reliability engineering"
  - id: CAP_PEOPLE
    name: "People & Change"
    description: "Training, adoption, operating model"

# ---------------------------------------------------------------------
# INITIATIVES (with milestones, dependencies, RACI, risks, benefits)
# ---------------------------------------------------------------------
initiatives:
  - id: INIT_A1
    name: "Automation Wave 1 (priority flows)"
    description: "Automation of priority CMS flows with safe controls."
    objective_ids: ["OBJ_1", "OBJ_2"]
    capability_ids: ["CAP_PROC", "CAP_TECH", "CAP_DATA"]
    owner: "IT Ops"
    sponsor: "CMS Transformation"
    raci:
      responsible: ["Automation Squad"]
      accountable: ["IT Ops Head"]
      consulted: ["Risk", "Compliance", "Data Office"]
      informed: ["Operations", "Front Office"]
    timeline:
      start: "2026-02-01"
      end: "2027-06-30"
      phase: "delivery"
    budget:
      currency: "EUR"
      amount_k: 600
      capex_opex_split: {capex: 0.55, opex: 0.45}
    dependencies:
      - type: "hard"
        initiative_id: "INIT_DQ1"
        rationale: "Automation needs stable reference data and DQ controls."
    workstreams:
      - id: WS_A1_CTRL
        name: "Controls-by-design for automated flows"
        description: "Define preventive/detective controls and reconciliation patterns before automation rollout."
        owner: "Ops Control Lead"
        start: "2026-02-01"
        end: "2026-06-30"
        effort_fte_months: 7.0
        deliverables:
          - id: D_A1_CTRL_1
            name: "Control matrix v1 for top 20 flows"
            due: "2026-04-15"
            owner: "Ops Control Lead"
            definition_of_done: ["Risk sign-off completed", "Control owners assigned"]
            operational_kpis: ["KPI_INC"]
          - id: D_A1_CTRL_2
            name: "Reconciliation SOP and exception workflow"
            due: "2026-06-30"
            owner: "Operations Manager"
            definition_of_done: ["Runbook approved", "SLA defined for exception closure"]
            operational_kpis: ["KPI_INC", "KPI_E2E"]
        control_impacts: ["Improves control coverage on automated flows", "Reduces operational incident severity"]
        depends_on_workstreams: ["WS_DQ1_RULES"]
      - id: WS_A1_BUILD
        name: "Automation build and orchestration"
        description: "Implement automation for prioritized CMS flows with observability hooks."
        owner: "Automation Squad Lead"
        start: "2026-04-01"
        end: "2027-03-31"
        effort_fte_months: 14.0
        deliverables:
          - id: D_A1_BUILD_1
            name: "Pilot automations for top 5 flows"
            due: "2026-10-31"
            owner: "Automation Squad Lead"
            definition_of_done: ["Production deployment complete", "Rollback validated"]
            operational_kpis: ["KPI_STP", "KPI_E2E"]
          - id: D_A1_BUILD_2
            name: "Scale-out package for next 15 flows"
            due: "2027-03-31"
            owner: "Automation Squad Lead"
            definition_of_done: ["Flow templates standardized", "Monitoring integrated"]
            operational_kpis: ["KPI_STP"]
        control_impacts: ["Improves STP by reducing manual handoffs"]
        depends_on_workstreams: ["WS_DQ1_LINEAGE", "WS_RES1_OBS"]
      - id: WS_A1_UAT
        name: "UAT, adoption and operating model transition"
        description: "Drive business UAT, training, and handover to BAU operations."
        owner: "Business Change Manager"
        start: "2026-09-01"
        end: "2027-06-30"
        effort_fte_months: 8.0
        deliverables:
          - id: D_A1_UAT_1
            name: "UAT sign-off for pilot scope"
            due: "2026-12-15"
            owner: "Business Change Manager"
            definition_of_done: ["Business sign-off complete", "Known issues triaged"]
            operational_kpis: ["KPI_E2E"]
          - id: D_A1_UAT_2
            name: "Training and SOP update for scale scope"
            due: "2027-06-30"
            owner: "Operations Manager"
            definition_of_done: ["Training completion >90%", "SOP published"]
            operational_kpis: ["KPI_STP", "KPI_INC"]
        control_impacts: ["Reduces change risk during scale-up"]
        depends_on_workstreams: ["WS_A1_BUILD"]
    milestones:
      - id: MS_A1_1
        name: "Process baseline & control design"
        due: "2026-04-30"
        deliverables: ["As-is map", "Control matrix", "Automation candidates"]
      - id: MS_A1_2
        name: "Pilot automation deployed"
        due: "2026-10-31"
        deliverables: ["Pilot in prod", "Runbook", "Monitoring dashboards"]
      - id: MS_A1_3
        name: "Scale-out wave completed"
        due: "2027-06-30"
        deliverables: ["Scaled automation", "Lessons learned", "Updated SOP"]
    kpi_impacts:
      - kpi_id: KPI_STP
        expected_delta_by_end: +8.0
        confidence: 0.70
        lag_months: 2
      - kpi_id: KPI_E2E
        expected_delta_by_end: -0.5
        confidence: 0.65
        lag_months: 3
    benefits:
      - type: "efficiency"
        description: "Reduce manual effort and rework"
        estimate:
          unit: "FTE"
          value: 6.0
          confidence: 0.60
      - type: "quality"
        description: "Reduce manual errors and operational losses"
        estimate:
          unit: "index"
          value: 0.20
          confidence: 0.50
