            owner: "Data Lead"
            definition_of_done: ["Residual critical defects = 0", "Sign-off archived"]
            operational_kpis: ["KPI_STP"]
        control_impacts: ["Stabilizes upstream data consumed by automation"]
        depends_on_workstreams: ["WS_DQ1_LINEAGE"]
    milestones:
      - id: MS_DQ1_1
        name: "DQ rules defined & approved"
        due: "2026-03-31"
        deliverables: ["DQ rules", "DQ ownership", "DQ dashboards"]
      - id: MS_DQ1_2
        name: "DQ pipeline in place"
        due: "2026-07-31"
        deliverables: ["DQ checks in ETL", "Alerting", "Lineage documentation"]
      - id: MS_DQ1_3
        name: "Reference alignment completed"
        due: "2026-10-31"
        deliverables: ["Reference mappings", "Sign-off", "Change procedure"]
    kpi_impacts:
      - kpi_id: KPI_STP
        expected_delta_by_end: +3.0
        confidence: 0.55
        lag_months: 1
    risks:
      - id: R_DQ1_1
        category: "data"
        description: "Hidden data quality issues delay KPI reliability."
        likelihood: 0.50
        impact: 0.55
        mitigations:
          - "Prioritize top 3 data sources"
          - "Iterative rollout of DQ rules"

  - id: INIT_RES1
    name: "Observability & Incident Reduction"
