          - "Progressive instrumentation"

# ---------------------------------------------------------------------
# PORTFOLIO CONSTRAINTS & STRATEGIC POLICIES
# ---------------------------------------------------------------------
portfolio:
  constraints:
    - id: C1
      type: "budget"
      description: "Annual budget ceiling for CMS transformation"
      year_limits:
        "2026": 600
        "2027": 700
        "2028": 500
      currency: "EUR_k"
    - id: C2
      type: "capacity"
      description: "Max delivery capacity (effective FTE) per year"
      year_limits:
        "2026": 10
        "2027": 12
        "2028": 8
    - id: C3
      type: "control"
      description: "Minimum control coverage on automated flows"
      min_value: 0.95

  prioritization_rules:
    - "Prefer initiatives with high objective-weighted impact per cost."
    - "Penalize initiatives with hard dependencies at risk."
    - "Never sacrifice compliance constraints for speed."

# ---------------------------------------------------------------------
# REPORTING TEMPLATES (to drive automated narrative later)
# ---------------------------------------------------------------------
reporting:
  executive_summary:
    required_sections:
      - "What changed since last cycle?"
      - "Are we on track vs 2026–2028 trajectory?"
      - "Top risks and mitigations"
      - "Decisions needed this cycle"
  steering_committee:
    cadence: "monthly"
    decision_thresholds:
      drift_confidence: 0.75
      budget_overrun_pct: 0.10
      milestone_delay_days: 30

# ---------------------------------------------------------------------
# AGENT CONFIG (human-in-the-loop + safety constraints)
# ---------------------------------------------------------------------
agent_policy:
  autonomy_level: "recommend_only"      # recommend_only, approve_execute (not for bank PoC)
  escalation:
    if_confidence_below: 0.60
    if_compliance_impact: "high"
  recommendation_limits:
    - "No more than 3 actions per objective per cycle"
    - "Must include at least 1 low-risk alternative"
  explanation_requirements:
    include:
      - "evidence (KPIs/milestones)"
      - "assumptions"
      - "trade-offs"
      - "expected impact"
      - "risks"
